---
- name: Create Azure Resource Group
  hosts: localhost
  connection: local
  vars_files:
    - "../vars/default_vars.yml"
  tasks:
    - name: Create resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group_name }}"
        location: "{{ region }}"
      register: rg_output

    - name: Debug RG status
      ansible.builtin.debug:
        var: rg_output
